applyTheme();
const state={user:localStorage.getItem('mr_user')||'',userId:localStorage.getItem('mr_user_id')||'',role:localStorage.getItem('mr_role')||'',page:(location.search.indexOf('new=1')>-1?'new':'dashboard'),jobs:[],locations:[],equipment:[],schedules:[],users:[]};
let db=null,storageMode='IndexedDB';
function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(new Error('IndexedDB unavailable'));return}let req=indexedDB.open('BHR_Maintenance_DB',1);req.onupgradeneeded=()=>{let d=req.result;if(!d.objectStoreNames.contains('data'))d.createObjectStore('data')};req.onsuccess=()=>{db=req.result;resolve(db)};req.onerror=()=>reject(req.error||new Error('Database open failed'))})}
function dbGet(key){return new Promise((resolve,reject)=>{try{let r=db.transaction('data','readonly').objectStore('data').get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)}catch(e){reject(e)}})}
function dbSet(key,value){return new Promise((resolve,reject)=>{try{let r=db.transaction('data','readwrite').objectStore('data').put(value,key);r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)}catch(e){reject(e)}})}
async function initStorage(){
 try{
  await openDB();
  let existing=await dbGet('state');
  if(existing && Array.isArray(existing.jobs)){
   state.jobs=existing.jobs;state.locations=existing.locations||[];state.equipment=existing.equipment||[];state.schedules=existing.schedules||[];state.users=existing.users||[];
  }else{
   state.jobs=JSON.parse(localStorage.getItem('mr_jobs')||'[]');
   state.locations=JSON.parse(localStorage.getItem('mr_locations')||'[]');
   state.equipment=JSON.parse(localStorage.getItem('mr_equipment')||'[]');
   state.schedules=JSON.parse(localStorage.getItem('mr_schedules')||'[]');
   await dbSet('state',{jobs:state.jobs,locations:state.locations,equipment:state.equipment,schedules:state.schedules,users:state.users});
  }
  localStorage.removeItem('mr_jobs');localStorage.removeItem('mr_locations');localStorage.removeItem('mr_equipment');localStorage.removeItem('mr_schedules');
  storageMode='IndexedDB';
 }catch(e){
  storageMode='Browser fallback';
  state.jobs=JSON.parse(localStorage.getItem('mr_jobs')||'[]');
  state.locations=JSON.parse(localStorage.getItem('mr_locations')||'[]');
  state.equipment=JSON.parse(localStorage.getItem('mr_equipment')||'[]');
  state.schedules=JSON.parse(localStorage.getItem('mr_schedules')||'[]');
  state.users=JSON.parse(localStorage.getItem('mr_users')||'[]');
 }
 ensureUsers();
 render();
}

function localDate(d=new Date()){const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}

function save(){
 const snapshot={jobs:state.jobs,locations:state.locations,equipment:state.equipment,schedules:state.schedules,users:state.users};
 if(db){dbSet('state',snapshot).catch(()=>{storageMode='Browser fallback';localStorage.setItem('mr_jobs',JSON.stringify(state.jobs));localStorage.setItem('mr_locations',JSON.stringify(state.locations));localStorage.setItem('mr_equipment',JSON.stringify(state.equipment));localStorage.setItem('mr_schedules',JSON.stringify(state.schedules));localStorage.setItem('mr_users',JSON.stringify(state.users))})}
 else{localStorage.setItem('mr_jobs',JSON.stringify(state.jobs));localStorage.setItem('mr_locations',JSON.stringify(state.locations));localStorage.setItem('mr_equipment',JSON.stringify(state.equipment));localStorage.setItem('mr_schedules',JSON.stringify(state.schedules));localStorage.setItem('mr_users',JSON.stringify(state.users))}
}

function updateJob(e,id){
e.preventDefault();

let f=new FormData(e.target);
let updated=Object.fromEntries(f.entries());
updated.id=old.id;
updated.before=document.getElementById('editBeforeData').value||old.before||'';
updated.after=document.getElementById('editAfterData').value||old.after||'';
let idx=state.jobs.findIndex(x=>String(x.id)===String(id));
state.jobs[idx]=updated;
if(updated.location&&!state.locations.includes(updated.location))state.locations.push(updated.location);
if(updated.equipment&&!state.equipment.includes(updated.equipment))state.equipment.push(updated.equipment);
save();state.q='';state.f='All';state.page='jobs';render();window.scrollTo(0,0);toast('Maintenance report updated successfully.');
}

function equipment(){const c={},l={};state.jobs.forEach(j=>{if(j.equipment){c[j.equipment]=(c[j.equipment]||0)+1;if((j.date||'')>(l[j.equipment]||''))l[j.equipment]=j.date}});return `<div class="row between"><h2>Equipment</h2><button class="btn" onclick="addEquipment()">Add equipment</button></div>${state.equipment.length?state.equipment.slice().sort().map(x=>`<div class="card item" onclick="openJobsFor('${encodeURIComponent(x)}')"><div><b>${esc(x)}</b><span>${c[x]?c[x]+' report'+(c[x]===1?'':'s')+', last service '+esc(l[x]):'No service logged yet'}</span></div>${ic('wrench')}</div>`).join(''):`<div class="card empty">Add AHUs, FCUs, DVMs, cold rooms, freezers and other equipment.</div>`}`}

function syncAssignedName(sel){let u=state.users.find(x=>x.id===sel.value);let h=document.getElementById('assignedTechName');if(h)h.value=u?u.name:''}

function saveSchedule(e,id,isEdit){
e.preventDefault();
let f=new FormData(e.target),s=Object.fromEntries(f.entries());
s.id=id;s.createdBy=s.createdBy||state.userId;s.assignedTo=s.assignedTo||state.userId;if(s.assignedTo){let u=state.users.find(x=>x.id===s.assignedTo);if(u)s.technician=u.name;}
if(isEdit){
let i=state.schedules.findIndex(x=>String(x.id)===String(id));
if(i>=0)state.schedules[i]=s;
}else state.schedules.push(s);
save();state.page='schedule';render();toast(isEdit?'Schedule updated successfully.':'Schedule added successfully.');
}

function completeSchedule(id){
let s=state.schedules.find(x=>String(x.id)===String(id));if(!s)return;
if(s.status==='Completed'){s.status='Pending';s.completedAt='';s.completedBy='';save();render();return;}
if(!isAdmin()&&!isSupervisor()&&s.assignedTo!==state.userId)return alert('This work is not assigned to you.');
if(isAdmin()||isSupervisor()){if(confirm('Mark this scheduled work completed without creating a report?')){s.status='Completed';s.completedAt=new Date().toISOString();s.completedBy=state.userId;save();render();}return;}
newScheduleReport(s.id);
}
function newScheduleReport(id){let s=state.schedules.find(x=>String(x.id)===String(id));if(!s)return;state.pendingSchedule=s;go('new');}

function deleteSchedule(id){
if(!isAdmin()&&!isSupervisor())return alert('Only Admin/Supervisor can delete scheduled work.');
let s=state.schedules.find(x=>String(x.id)===String(id));if(!s)return;
if(confirm(`Delete scheduled work "${s.task}"?`)){
state.schedules=state.schedules.filter(x=>String(x.id)!==String(id));
save();render();
}
}

async function shareMonthlyReport(month){
let jobs=state.jobs.filter(j=>monthKey(j.date)===month);
let pretty=monthName(month);
let completed=jobs.filter(j=>j.status==='Completed').length;
let pending=jobs.filter(j=>j.status!=='Completed').length;
let critical=jobs.filter(j=>j.priority==='Critical').length;
let technicians=[...new Set(jobs.map(j=>j.technician).filter(Boolean))];
let lines=[
`BHR Solutions — Monthly HVAC Maintenance Report`,
`Month: ${pretty}`,
`Total jobs: ${jobs.length}`,
`Completed: ${completed}`,
`Pending / In progress: ${pending}`,
`Critical: ${critical}`,
`Technicians: ${technicians.length}`,
``,
`Job details:`,
...jobs.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map((j,i)=>
`${i+1}. ${j.date} | ${j.location||'-'} | ${j.equipment||'-'} | ${j.type||'-'} | ${j.technician||'-'} | ${j.status||'-'}\nWork: ${j.work||'-'}\nParts: ${j.parts||'-'}`
)
];
let text=lines.join('\n');
if(navigator.share){
  try{
    await navigator.share({title:`BHR Solutions Monthly Report — ${pretty}`,text});
    return;
  }catch(e){
    if(e && e.name==='AbortError') return;
  }
}
try{
  await navigator.clipboard.writeText(text);
  toast('Monthly report details copied. You can paste them into WhatsApp, email, or another app.');
}catch(e){
  prompt('Copy this monthly report:',text);
}
}

function buildMonthlyReportHTML(month){

function printMonthlyReport(month){
  let html=buildMonthlyReportHTML(month);
  let m=html.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
  let s=html.match(/<style[^>]*>([\s\S]*?)<\/style>/i);
  let body=m?m[1]:html;
  let styles=s?s[1]:'';
  let oldBody=document.body.innerHTML;
  let oldTitle=document.title;
  let oldOverflow=document.body.style.overflow;
  let restoreDone=false;
  function restore(){
    if(restoreDone)return;
    restoreDone=true;
    document.body.innerHTML=oldBody;
    document.title=oldTitle;
    document.body.style.overflow=oldOverflow;
    window.removeEventListener('afterprint',restore);
  }
  document.title='BHR Solutions Monthly Maintenance Report - '+monthName(month);
  document.body.style.overflow='visible';
  document.body.innerHTML='<style id="bhr-print-style">'+styles+' body{padding:0!important;margin:0!important;} .print-only-report{padding:8mm;} @media print{.print-only-report{padding:8mm;} }</style><main class="print-only-report">'+body+'</main>';
  window.addEventListener('afterprint',restore);
  setTimeout(function(){window.print();},150);
}
function users(){
if(!isAdmin())return `<div class="card empty">Admin access required.</div>`;
let active=state.users.filter(u=>u.active!==false),inactive=state.users.filter(u=>u.active===false);
return `<div class="row between"><h2>Staff Management</h2><button class="btn" onclick="addUser()">+ Add Staff</button></div>
<div class="card" style="margin-bottom:12px"><b>${active.length}</b> active staff member${active.length===1?'':'s'} <span style="color:var(--mut);font-size:12px">• ${inactive.length} inactive</span></div>
${active.map(userCard).join('')||`<div class="card empty">No staff accounts yet.</div>`}
${inactive.length?`<div class="section"><h3>Inactive Staff</h3>${inactive.map(userCard).join('')}</div>`:''}`;
}
function userCard(u){return `<div class="card job" style="margin-bottom:9px"><div class="row between"><div><b>${esc(u.name)}</b><div style="font-size:12px;color:var(--mut)">${esc(u.role)} • ${esc(u.employeeId||u.id)}</div><div style="font-size:12px;color:var(--mut)">Username: ${esc(u.username)}</div></div><span class="badge ${u.active===false?'pending':''}">${u.active===false?'Inactive':'Active'}</span></div><div class="row" style="margin-top:10px;flex-wrap:wrap"><button class="btn secondary" onclick="editUser('${u.id}')">Edit</button><button class="btn ${u.active===false?'green':'red'}" onclick="toggleUser('${u.id}')">${u.active===false?'Activate':'Deactivate'}</button><button class="btn secondary" onclick="resetUserPin('${u.id}')">Reset PIN</button></div></div>`}
function addUser(existing){let u=existing||{id:'USR-'+Date.now(),name:'',employeeId:'',role:'Technician',username:'',pin:'1234',active:true};showUserForm(u,!!existing)}
function editUser(id){let u=state.users.find(x=>x.id===id);if(u)addUser(u)}
function showUserForm(u,isEdit){document.getElementById('root').innerHTML=`<div class="app"><div class="top"><div class="brand"><div><h1>Maintenance Report</h1><small>BHR Solutions • Staff Management</small></div></div></div><main class="content"><div class="row between"><h2>${isEdit?'Edit Staff':'Add Staff'}</h2><button class="btn secondary" onclick="go('users')">← Back</button></div><form onsubmit="saveUser(event,'${esc(u.id)}',${isEdit})"><label>Full Name</label><input name="name" value="${esc(u.name)}" required placeholder="e.g. Gopi Kumar"><label>Employee ID</label><input name="employeeId" value="${esc(u.employeeId)}" placeholder="e.g. BHR-005"><label>Role</label><select name="role">${['Technician','HVAC Engineer','Electrician','Plumber','Supervisor','Admin'].map(r=>`<option ${r===u.role?'selected':''}>${r}</option>`).join('')}</select><label>Username</label><input name="username" value="${esc(u.username)}" required autocomplete="off" placeholder="e.g. gopi"><label>PIN / Password</label><input name="pin" value="${esc(u.pin||'1234')}" required autocomplete="new-password"><label>Account Status</label><select name="active"><option value="true" ${u.active!==false?'selected':''}>Active</option><option value="false" ${u.active===false?'selected':''}>Inactive</option></select><button class="btn green" style="width:100%;margin-top:16px">${isEdit?'Save Changes':'Create Staff Account'}</button></form></main><div class="footer">BHR Solutions • Maintenance Report v11</div></div>`}
function saveUser(e,id,isEdit){e.preventDefault();let f=new FormData(e.target),u=Object.fromEntries(f.entries());u.id=id;u.active=u.active==='true';u.createdAt=(state.users.find(x=>x.id===id)||{}).createdAt||new Date().toISOString();if(state.users.some(x=>x.username.toLowerCase()===u.username.toLowerCase()&&x.id!==id))return alert('Username already exists. Choose another username.');if(u.role==='Admin'&&!isEdit&&state.users.filter(x=>x.role==='Admin'&&x.active!==false).length>=5)return alert('Keep the number of Admin accounts limited.');let i=state.users.findIndex(x=>x.id===id);if(i>=0)state.users[i]=u;else state.users.push(u);save();if(state.userId===id){state.user=u.name;state.role=u.role;localStorage.setItem('mr_user',u.name);localStorage.setItem('mr_role',u.role);}state.page='users';render();toast(isEdit?'Staff account updated.':'Staff account created.')}
function toggleUser(id){let u=state.users.find(x=>x.id===id);if(!u)return;if(u.id===state.userId)return alert('You cannot deactivate your own account.');u.active=u.active===false;save();render()}
function resetUserPin(id){let u=state.users.find(x=>x.id===id);if(!u)return;let pin=prompt('Enter new PIN/password for '+u.name,'1234');if(pin===null)return;if(String(pin).trim().length<4)return alert('PIN/password must be at least 4 characters.');u.pin=String(pin).trim();save();toast('PIN/password reset successfully.')}

function backupPage(){
let total=state.jobs.length, schedules=state.schedules.length, photos=state.jobs.filter(j=>j.before||j.after).length;
let last=localStorage.getItem('mr_last_backup');
return `<h2>Data Backup & Export</h2>
<div class="backupbox"><div class="row"><div class="backupicon">🛡️</div><div><h3 style="margin:0">Protect your maintenance history</h3><p style="margin:4px 0;color:#64748b;font-size:12px">Your jobs stay on this device. Use a JSON backup regularly so you can restore everything, including before/after photos.</p></div></div></div>
<div class="card" style="margin-bottom:12px;background:#f5fbf7;border-color:#cfe9da"><b>Offline storage: ${storageMode}</b><p style="margin:5px 0 0;color:#64748b;font-size:12px">Jobs, schedules and photos are stored locally on this phone and remain available without internet. Keep regular backups before resetting or clearing the app.</p></div>
<div class="grid">
<div class="card stat"><b>${total}</b><span>Saved maintenance reports</span></div>
<div class="card stat"><b>${schedules}</b><span>Saved schedules</span></div>
</div>
<div class="section backupbox"><h3>Full Backup — Recommended</h3><p style="font-size:12px;color:#64748b">Creates one backup file containing jobs, photos, schedules, locations, equipment and app settings. Keep this file somewhere safe.</p><button class="btn green" onclick="downloadBackup()">Backup Everything (JSON)</button>${last?`<p style="font-size:11px;color:#64748b;margin:9px 0 0">Last backup: ${esc(last)}</p>`:''}</div>
<div class="section backupbox"><h3>Excel / CSV Export</h3><p style="font-size:12px;color:#64748b">CSV files open directly in Microsoft Excel and contain your maintenance records in table form. Photos are represented by Yes/No columns.</p><div class="row" style="flex-wrap:wrap"><button class="btn" onclick="exportJobsCSV()">Export All Jobs CSV</button><button class="btn secondary" onclick="exportCurrentMonthCSV()">Export Selected Month CSV</button></div></div>
<div class="section backupbox"><h3>Restore Full Backup</h3><p style="font-size:12px;color:#64748b">Choose a JSON backup previously created by this app. Restoring replaces the current app data with the backup data.</p><label class="filebtn">Choose Backup File<input type="file" accept="application/json,.json" class="hidden" onchange="restoreBackup(this)"></label></div>
<div class="section backupbox"><h3>Important</h3><ul style="font-size:12px;color:#64748b;line-height:1.6;padding-left:20px"><li>Export a backup before clearing Chrome site data or changing/resetting your phone.</li><li>The JSON backup preserves photos; CSV does not.</li><li>GitHub Pages hosts the app, but your job records are not uploaded to GitHub.</li></ul></div>`;
}
function downloadFile(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function stamp(){let d=new Date();return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'_'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+String(d.getSeconds()).padStart(2,'0')}
function downloadBackup(){
let payload={app:'BHR Solutions Maintenance Report',version:2,backupCreatedAt:new Date().toISOString(),user:state.user,userId:state.userId,role:state.role,users:state.users,jobs:state.jobs,locations:state.locations,equipment:state.equipment,schedules:state.schedules,reportDate:localStorage.getItem('mr_report_date')||'',reportMonth:localStorage.getItem('mr_report_month')||''};
downloadFile('BHR_Maintenance_Backup_'+stamp()+'.json',JSON.stringify(payload,null,2),'application/json;charset=utf-8');
localStorage.setItem('mr_last_backup',new Date().toLocaleString());
toast('Backup created successfully. Save the JSON file somewhere safe.');render();
}
function csvCell(v){let x=String(v??'').replace(/\r?\n/g,' ');return '"'+x.replace(/"/g,'""')+'"'}
function jobsCSV(jobs){
let headers=['ID','Date','Technician','Location','Equipment','Work Type','Complaint / Observation','Work Performed','Parts / Materials','Remarks','Room Temp °C','Supply Air °C','Return Air °C','Suction PSI','Discharge PSI','Compressor A','Fan A','Voltage L1-L2','Voltage L2-L3','Voltage L3-L1','Status','Priority','Before Photo','After Photo'];
let rows=[headers.map(csvCell).join(',')];
for(let j of jobs){rows.push([j.id,j.date,j.technician,j.location,j.equipment,j.type,j.complaint,j.work,j.parts,j.remarks,j.r0,j.r1,j.r2,j.r3,j.r4,j.r5,j.r6,j.r7,j.r8,j.r9,j.status,j.priority,j.before?'Yes':'No',j.after?'Yes':'No'].map(csvCell).join(','))}
return '\ufeff'+rows.join('\r\n');
}
function exportJobsCSV(){downloadFile('BHR_Maintenance_All_Jobs_'+stamp()+'.csv',jobsCSV(state.jobs),'text/csv;charset=utf-8');toast('All maintenance jobs exported. The CSV can be opened in Excel.');}
function exportCurrentMonthCSV(){let m=localStorage.getItem('mr_report_month')||localDate().slice(0,7);let jobs=state.jobs.filter(j=>monthKey(j.date)===m);downloadFile('BHR_Maintenance_'+m+'.csv',jobsCSV(jobs),'text/csv;charset=utf-8');toast('Selected month exported: '+monthName(m));}
function restoreBackup(inp){let f=inp.files&&inp.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||!Array.isArray(x.jobs)||!Array.isArray(x.schedules))throw new Error('Invalid backup');if(!confirm('Restore this backup? Current saved data will be replaced by the backup.'))return;state.jobs=x.jobs;state.locations=Array.isArray(x.locations)?x.locations:[];state.equipment=Array.isArray(x.equipment)?x.equipment:[];state.schedules=x.schedules;state.users=Array.isArray(x.users)?x.users:state.users;state.user=x.user||state.user;state.userId=x.userId||state.userId;state.role=x.role||state.role;save();if(state.user)localStorage.setItem('mr_user',state.user);if(state.userId)localStorage.setItem('mr_user_id',state.userId);if(state.role)localStorage.setItem('mr_role',state.role);if(x.reportDate)localStorage.setItem('mr_report_date',x.reportDate);if(x.reportMonth)localStorage.setItem('mr_report_month',x.reportMonth);localStorage.setItem('mr_last_backup','Restored '+new Date().toLocaleString());toast('Backup restored successfully. Your maintenance history is back.');state.page='dashboard';render();}catch(e){alert('This is not a valid BHR Maintenance backup file.')}};r.readAsText(f);inp.value=''}

const pages={dashboard,new:newPage,jobs,locations,equipment,schedule,reports,users,backup:backupPage};initStorage();

let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
e.preventDefault();deferredInstallPrompt=e;
const b=document.getElementById('installBar');if(b)b.classList.add('show');
});
async function installPWA(){
if(!deferredInstallPrompt){
alert('If Chrome does not show the install prompt, open Chrome menu ⋮ and choose "Add to Home screen" or "Install app".');
return;
}
deferredInstallPrompt.prompt();
try{await deferredInstallPrompt.userChoice}catch(e){}
deferredInstallPrompt=null;
const b=document.getElementById('installBar');if(b)b.classList.remove('show');
}
window.addEventListener('appinstalled',()=>{
const b=document.getElementById('installBar');if(b)b.classList.remove('show');
});
if('serviceWorker' in navigator){
window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script></body></html>
