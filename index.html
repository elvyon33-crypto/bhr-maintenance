:root{--navy:#0b1f33;--blue:#1769aa;--bg:#f4f7fa;--green:#168a55;--red:#c74444;--muted:#64748b}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:#122033}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:900px;margin:auto;min-height:100vh;background:#fff}.top{background:linear-gradient(135deg,#09233d,#1769aa);color:white;padding:22px 18px 18px}.brand{display:flex;justify-content:space-between;align-items:center}.brand h1{margin:0;font-size:21px}.brand small{opacity:.8}.user{font-size:12px;background:#ffffff20;padding:7px 10px;border-radius:20px}.nav{display:flex;gap:7px;overflow:auto;padding:10px;background:#fff;border-bottom:1px solid #e7edf3;position:sticky;top:0;z-index:5}.nav button{border:0;background:#eef3f7;color:#294158;border-radius:10px;padding:9px 12px;white-space:nowrap}.nav button.active{background:var(--blue);color:#fff}.content{padding:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{border:1px solid #e4eaf0;border-radius:14px;padding:14px;background:#fff;box-shadow:0 2px 8px #09233d08}.stat b{font-size:26px;display:block}.stat span{font-size:12px;color:var(--muted)}h2{font-size:20px;margin:4px 0 14px}h3{font-size:15px;margin:0 0 8px}.section{margin:18px 0}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.btn{border:0;border-radius:10px;padding:11px 14px;background:var(--blue);color:#fff}.btn.secondary{background:#e9eef3;color:#1e3a52}.btn.green{background:var(--green)}.btn.red{background:var(--red)}label{font-size:12px;font-weight:700;color:#41566b;display:block;margin:10px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #ccd7e1;border-radius:9px;background:#fff}textarea{min-height:85px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.photo{border:2px dashed #c8d4df;border-radius:12px;min-height:110px;display:flex;align-items:center;justify-content:center;color:#718397;background:#f8fafc;overflow:hidden}.photo img{width:100%;height:150px;object-fit:cover}.badge{font-size:11px;padding:5px 8px;border-radius:20px;background:#e9f6ef;color:#147445}.badge.pending{background:#fff2dc;color:#9a6200}.badge.repair{background:#feecec;color:#a52f2f}.job{margin-bottom:10px}.job p{margin:5px 0;color:#596d80;font-size:13px}.empty{text-align:center;color:#718397;padding:35px}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#09233d,#1769aa);padding:20px}.loginbox{background:white;border-radius:18px;padding:25px;max-width:390px;width:100%;box-shadow:0 15px 50px #0003}.logo{width:58px;height:58px;border-radius:15px;background:#1769aa;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;margin-bottom:15px}.footer{padding:20px;text-align:center;color:#8796a6;font-size:11px}.hidden{display:none!important}@media(max-width:600px){.formgrid{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.content{padding:13px}.top{padding-top:18px}}

.installbar{display:none;background:#eaf4fb;border:1px solid #c7e0ef;border-radius:12px;padding:11px 12px;margin-bottom:12px}
.installbar.show{display:block}.installbar b{display:block;margin-bottom:4px}.installbar span{font-size:12px;color:#52687a}.backupbox{border:1px solid #dce6ee;border-radius:14px;padding:15px;margin-bottom:12px;background:#fbfdff}.backupicon{font-size:30px}.filebtn{display:inline-block;border:0;border-radius:10px;padding:11px 14px;background:#e9eef3;color:#1e3a52;cursor:pointer;font-weight:600}
.report-photo-thumb{width:74px;height:54px;object-fit:cover;border:1px solid #d5dde5;border-radius:7px;cursor:pointer;background:#f5f7fa;display:block}.report-photo-cell{min-width:170px}.report-photo-pair{display:flex;gap:7px;align-items:flex-start;flex-wrap:wrap}.report-photo-pair>div{width:74px;text-align:center;font-size:9px;color:#64748b}.photo-empty{display:inline-block;width:74px;height:54px;border:1px dashed #cbd5e1;border-radius:7px;font-size:9px;color:#94a3b8;padding:17px 4px 0;text-align:center;box-sizing:border-box}.photo-evidence{margin-top:18px}.photo-evidence-card{border:1px solid #dbe5ed;border-radius:10px;padding:12px;margin-bottom:10px;background:#fff}.photo-evidence-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.photo-evidence-grid img{width:100%;max-height:240px;object-fit:contain;border:1px solid #ddd;border-radius:8px;background:#f8fafc}.photo-evidence-grid .no-photo{min-height:120px;border:1px dashed #cbd5e1;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:12px}@media(max-width:700px){.photo-evidence-grid{grid-template-columns:1fr 1fr}.report-photo-thumb{width:66px;height:50px}}</style></head><body><div id="root"></div><script>
const state={user:localStorage.getItem('mr_user')||'',page:'dashboard',jobs:[],locations:[],equipment:[],schedules:[]};
let db=null,storageMode='IndexedDB';
function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(new Error('IndexedDB unavailable'));return}let req=indexedDB.open('BHR_Maintenance_DB',1);req.onupgradeneeded=()=>{let d=req.result;if(!d.objectStoreNames.contains('data'))d.createObjectStore('data')};req.onsuccess=()=>{db=req.result;resolve(db)};req.onerror=()=>reject(req.error||new Error('Database open failed'))})}
function dbGet(key){return new Promise((resolve,reject)=>{try{let r=db.transaction('data','readonly').objectStore('data').get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)}catch(e){reject(e)}})}
function dbSet(key,value){return new Promise((resolve,reject)=>{try{let r=db.transaction('data','readwrite').objectStore('data').put(value,key);r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)}catch(e){reject(e)}})}
async function initStorage(){
 try{
  await openDB();
  let existing=await dbGet('state');
  if(existing && Array.isArray(existing.jobs)){
   state.jobs=existing.jobs;state.locations=existing.locations||[];state.equipment=existing.equipment||[];state.schedules=existing.schedules||[];
  }else{
   state.jobs=JSON.parse(localStorage.getItem('mr_jobs')||'[]');
   state.locations=JSON.parse(localStorage.getItem('mr_locations')||'[]');
   state.equipment=JSON.parse(localStorage.getItem('mr_equipment')||'[]');
   state.schedules=JSON.parse(localStorage.getItem('mr_schedules')||'[]');
   await dbSet('state',{jobs:state.jobs,locations:state.locations,equipment:state.equipment,schedules:state.schedules});
  }
  localStorage.removeItem('mr_jobs');localStorage.removeItem('mr_locations');localStorage.removeItem('mr_equipment');localStorage.removeItem('mr_schedules');
  storageMode='IndexedDB';
 }catch(e){
  storageMode='Browser fallback';
  state.jobs=JSON.parse(localStorage.getItem('mr_jobs')||'[]');
  state.locations=JSON.parse(localStorage.getItem('mr_locations')||'[]');
  state.equipment=JSON.parse(localStorage.getItem('mr_equipment')||'[]');
  state.schedules=JSON.parse(localStorage.getItem('mr_schedules')||'[]');
 }
 render();
}

function localDate(d=new Date()){const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function monthKey(d){return String(d||'').slice(0,7)}
function monthName(m){const [y,mo]=m.split('-');return new Date(Number(y),Number(mo)-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'})}
const types=['Room Filter Cleaning','Office Filter Cleaning','AHU Coil Cleaning','AHU Filter Cleaning / Replacement','DVM Coil Cleaning','DVM Maintenance','Cold Room Cleaning','Freezer Cleaning','Preventive Maintenance','Repair','Breakdown','Inspection','Other'];
function save(){
 const snapshot={jobs:state.jobs,locations:state.locations,equipment:state.equipment,schedules:state.schedules};
 if(db){dbSet('state',snapshot).catch(()=>{storageMode='Browser fallback';localStorage.setItem('mr_jobs',JSON.stringify(state.jobs));localStorage.setItem('mr_locations',JSON.stringify(state.locations));localStorage.setItem('mr_equipment',JSON.stringify(state.equipment));localStorage.setItem('mr_schedules',JSON.stringify(state.schedules))})}
 else{localStorage.setItem('mr_jobs',JSON.stringify(state.jobs));localStorage.setItem('mr_locations',JSON.stringify(state.locations));localStorage.setItem('mr_equipment',JSON.stringify(state.equipment));localStorage.setItem('mr_schedules',JSON.stringify(state.schedules))}
}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){if(!state.user){document.getElementById('root').innerHTML=`<div class="login"><div class="loginbox"><div class="logo">MR</div><h2>Maintenance Report</h2><p style="color:#66788a">BHR Solutions — HVAC maintenance reporting</p><label>Technician name</label><input id="loginName" placeholder="Enter your name"><label>Role</label><select id="loginRole"><option>Technician</option><option>HVAC Engineer</option><option>Supervisor</option><option>Admin</option></select><button class="btn" style="width:100%;margin-top:15px" onclick="login()">Sign in</button></div></div>`;return}
const nav=[['dashboard','🏠 Dashboard'],['new','➕ New Report'],['jobs','📋 Jobs'],['locations','🏢 Locations'],['equipment','🔧 Equipment'],['schedule','📅 Schedule'],['reports','📊 Reports'],['backup','💾 Backup']];document.getElementById('root').innerHTML=`<div class="app"><div class="top"><div class="brand"><div><h1>Maintenance Report</h1><small>BHR Solutions • Hotel HVAC</small></div><div class="user">👤 ${esc(state.user)} <span onclick="logout()" style="cursor:pointer">×</span></div></div></div><div class="nav">${nav.map(x=>`<button class="${state.page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</div><main class="content"><div id="installBar" class="installbar"><b>📱 Install BHR Maintenance</b><span>Add this app to your phone home screen for quick access.</span><button class="btn" style="margin-top:8px" onclick="installPWA()">Install App</button></div>${pages[state.page]()}</main><div class="footer">BHR Solutions • Maintenance Report Prototype</div></div>`}
function login(){let n=document.getElementById('loginName').value.trim();if(!n)return alert('Enter technician name');state.user=n;localStorage.setItem('mr_user',n);render()}function logout(){localStorage.removeItem('mr_user');state.user='';render()}function go(p){state.page=p;render()}
function dashboard(){let today=localDate(), t=state.jobs.filter(j=>j.date===today),done=t.filter(j=>j.status==='Completed').length,p=t.filter(j=>j.status!=='Completed').length;return `<h2>Good morning, ${esc(state.user)} 👋</h2><div class="grid"><div class="card stat"><b>${t.length}</b><span>Today's jobs</span></div><div class="card stat"><b>${done}</b><span>Completed</span></div><div class="card stat"><b>${p}</b><span>Pending / In progress</span></div><div class="card stat"><b>${state.jobs.length}</b><span>Total reports</span></div></div><div class="section"><div class="row between"><h3>Quick actions</h3><button class="btn" onclick="go('new')">+ New report</button></div></div><div class="section"><h3>Today's maintenance</h3>${t.length?t.slice().reverse().map(jobCard).join(''):`<div class="card empty">No reports today.<br><button class="btn" style="margin-top:12px" onclick="go('new')">Create first report</button></div>`}</div><div class="section"><div class="row between"><h3>📅 Today's Schedule</h3><button class="btn" onclick="go('schedule')">View Schedule</button></div>${state.schedules.filter(x=>x.date===today).length?state.schedules.filter(x=>x.date===today).sort((a,b)=>(a.time||'').localeCompare(b.time||'')).slice(0,5).map(scheduleCard).join(''):`<div class="card empty">No schedule for today.</div>`}</div>`}
function jobCard(j){
return `<div class="card job">
<div class="row between"><div><b>${esc(j.location||'No location')}</b> • ${esc(j.equipment||'No equipment')}</div><span class="badge ${j.status!=='Completed'?'pending':''}">${esc(j.status)}</span></div>
<p>${esc(j.type)} • ${esc(j.technician)} • ${esc(j.date)}</p>
<p>${esc(j.work||'')}</p>
<div class="row" style="margin-top:8px"><span class="badge">Before ${j.before?'📷':''}</span><span class="badge">After ${j.after?'📷':''}</span></div>
<div class="row" style="margin-top:12px;flex-wrap:wrap">
<button class="btn" onclick="viewJob('${j.id}')">👁️ View</button>
<button class="btn secondary" onclick="editJob('${j.id}')">✏️ Edit</button>
<button class="btn green" onclick="shareJob('${j.id}')">↗️ Share</button>
<button class="btn red" onclick="deleteJob('${j.id}')">🗑️ Delete</button>
</div>
</div>`}
function newPage(){return `<h2>New Maintenance Report</h2><form onsubmit="submitJob(event)"><div class="formgrid"><div><label>Date</label><input name="date" type="date" value="${localDate()}" required></div><div><label>Technician</label><input name="technician" value="${esc(state.user)}" required></div></div><label>Maintenance / Work Type</label><select name="type" required>${types.map(t=>`<option>${t}</option>`).join('')}</select><div class="formgrid"><div><label>Location / Room No.</label><input name="location" list="locs" placeholder="e.g. Room 305 / AHU Plant Room" required><datalist id="locs">${state.locations.map(x=>`<option>${esc(x)}</option>`).join('')}</datalist></div><div><label>Equipment</label><input name="equipment" list="eqs" placeholder="e.g. FCU-305 / AHU-01"><datalist id="eqs">${state.equipment.map(x=>`<option>${esc(x)}</option>`).join('')}</datalist></div></div><label>Complaint / Observation</label><textarea name="complaint" placeholder="What did you find?"></textarea><div class="formgrid">
<div>
<label>Before Photo</label>
<div class="row" style="margin-bottom:8px">
<button type="button" class="btn" onclick="document.getElementById('beforeCamera').click()">📷 Camera</button>
<button type="button" class="btn secondary" onclick="document.getElementById('beforeGallery').click()">🖼️ Gallery</button>
</div>
<input id="beforeCamera" type="file" accept="image/*" capture="environment" class="hidden" onchange="setPhoto(this,'before','beforePrev')">
<input id="beforeGallery" type="file" accept="image/*" class="hidden" onchange="setPhoto(this,'before','beforePrev')">
<div class="photo" id="beforePrev">📷 Select before photo</div>
<input id="beforeData" name="before" type="hidden">
</div>
<div>
<label>After Photo</label>
<div class="row" style="margin-bottom:8px">
<button type="button" class="btn" onclick="document.getElementById('afterCamera').click()">📷 Camera</button>
<button type="button" class="btn secondary" onclick="document.getElementById('afterGallery').click()">🖼️ Gallery</button>
</div>
<input id="afterCamera" type="file" accept="image/*" capture="environment" class="hidden" onchange="setPhoto(this,'after','afterPrev')">
<input id="afterGallery" type="file" accept="image/*" class="hidden" onchange="setPhoto(this,'after','afterPrev')">
<div class="photo" id="afterPrev">📷 Select after photo</div>
<input id="afterData" name="after" type="hidden">
</div>
</div><div class="section"><h3>HVAC Readings (optional)</h3><div class="formgrid">${['Room Temp °C','Supply Air °C','Return Air °C','Suction PSI','Discharge PSI','Compressor A','Fan A','Voltage L1-L2','Voltage L2-L3','Voltage L3-L1'].map((x,i)=>`<div><label>${x}</label><input name="r${i}" inputmode="decimal"></div>`).join('')}</div></div><label>Work Performed</label><textarea name="work" placeholder="Describe cleaning, repair, parts replaced, adjustments, etc." required></textarea><label>Parts / Materials Used</label><textarea name="parts" placeholder="Filter, belt, refrigerant, capacitor, contactor, etc."></textarea><label>Remarks</label><textarea name="remarks" placeholder="Unit condition after work / recommendations"></textarea><div class="formgrid"><div><label>Status</label><select name="status"><option>Completed</option><option>In Progress</option><option>Pending</option></select></div><div><label>Priority</label><select name="priority"><option>Normal</option><option>High</option><option>Critical</option></select></div></div><button class="btn green" style="width:100%;margin-top:16px">Save Maintenance Report</button></form>`}
function setPhoto(inp,type,id){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{document.getElementById(id).innerHTML=`<img src="${e.target.result}">`;document.getElementById(type+'Data').value=e.target.result};r.readAsDataURL(f)}
function submitJob(e){
e.preventDefault();
let f=new FormData(e.target),j=Object.fromEntries(f.entries());
j.id=Date.now();j.technician=state.user;
j.before=document.getElementById('beforeData').value||'';
j.after=document.getElementById('afterData').value||'';
state.jobs.push(j);
if(j.location&&!state.locations.includes(j.location))state.locations.push(j.location);
if(j.equipment&&!state.equipment.includes(j.equipment))state.equipment.push(j.equipment);
save();state.page='jobs';render();alert('Maintenance report saved successfully.');
}

function getJob(id){return state.jobs.find(x=>String(x.id)===String(id))}
function deleteJob(id){
let j=getJob(id);
if(!j)return alert('Job not found.');
let label=`${j.date||''} — ${j.location||'No location'} — ${j.equipment||'No equipment'}`.replace(/^ — | — $/g,'');
if(confirm(`Delete this maintenance record?\n\n${label}\n\nThis action cannot be undone unless you have a backup.`)){
state.jobs=state.jobs.filter(x=>String(x.id)!==String(id));
save();
render();
alert('Maintenance record deleted.');
}
}
function viewJob(id){
let j=getJob(id); if(!j)return alert('Job not found.');
let photos='';
if(j.before)photos+=`<div><h3>Before Photo</h3><img src="${j.before}" style="width:100%;max-height:320px;object-fit:contain;border-radius:10px;border:1px solid #ddd"></div>`;
if(j.after)photos+=`<div><h3>After Photo</h3><img src="${j.after}" style="width:100%;max-height:320px;object-fit:contain;border-radius:10px;border:1px solid #ddd"></div>`;
let readings=['Room Temp °C','Supply Air °C','Return Air °C','Suction PSI','Discharge PSI','Compressor A','Fan A','Voltage L1-L2','Voltage L2-L3','Voltage L3-L1'];
let readingHtml=readings.map((x,i)=>j['r'+i]?`<div class="card"><b>${esc(x)}</b><div style="margin-top:4px">${esc(j['r'+i])}</div></div>`:'').join('');
document.getElementById('root').innerHTML=`<div class="app">
<div class="top"><div class="brand"><div><h1>Maintenance Report</h1><small>BHR Solutions • Job Details</small></div></div></div>
<main class="content">
<div class="row between"><h2>Job Details</h2><button class="btn secondary" onclick="render()">← Back</button></div>
<div class="card">
<h3>${esc(j.location||'No location')} • ${esc(j.equipment||'No equipment')}</h3>
<p><b>Date:</b> ${esc(j.date)} &nbsp; <b>Technician:</b> ${esc(j.technician)}</p>
<p><b>Type:</b> ${esc(j.type)} &nbsp; <b>Status:</b> ${esc(j.status)} &nbsp; <b>Priority:</b> ${esc(j.priority)}</p>
<h3>Complaint / Observation</h3><p>${esc(j.complaint||'—')}</p>
<h3>Work Performed</h3><p>${esc(j.work||'—')}</p>
<h3>Parts / Materials Used</h3><p>${esc(j.parts||'—')}</p>
<h3>Remarks</h3><p>${esc(j.remarks||'—')}</p>
</div>
${readingHtml?`<div class="section"><h3>HVAC Readings</h3><div class="grid">${readingHtml}</div></div>`:''}
${photos?`<div class="section"><h3>Before / After Photos</h3><div class="formgrid">${photos}</div></div>`:''}
<div class="row" style="margin-top:15px;flex-wrap:wrap">
<button class="btn" onclick="editJob('${j.id}')">✏️ Edit Job</button>
<button class="btn green" onclick="shareJob('${j.id}')">↗️ Share Job</button>
<button class="btn secondary" onclick="printSingleJob('${j.id}')">🖨️ Print</button>
</div>
</main><div class="footer">BHR Solutions • Maintenance Report</div></div>`;
}

function editJob(id){
let j=getJob(id); if(!j)return alert('Job not found.');
state.page='edit_'+id;
renderEditPage(j);
}

function renderEditPage(j){
const readings=['Room Temp °C','Supply Air °C','Return Air °C','Suction PSI','Discharge PSI','Compressor A','Fan A','Voltage L1-L2','Voltage L2-L3','Voltage L3-L1'];
document.getElementById('root').innerHTML=`<div class="app">
<div class="top"><div class="brand"><div><h1>Maintenance Report</h1><small>BHR Solutions • Edit Job</small></div></div></div>
<main class="content"><div class="row between"><h2>Edit Maintenance Report</h2><button class="btn secondary" onclick="go('jobs')">← Back</button></div>
<form onsubmit="updateJob(event,'${j.id}')">
<div class="formgrid"><div><label>Date</label><input name="date" type="date" value="${esc(j.date)}" required></div><div><label>Technician</label><input name="technician" value="${esc(j.technician)}" required></div></div>
<label>Maintenance / Work Type</label><select name="type">${types.map(t=>`<option ${t===j.type?'selected':''}>${t}</option>`).join('')}</select>
<div class="formgrid"><div><label>Location / Room No.</label><input name="location" value="${esc(j.location)}" required></div><div><label>Equipment</label><input name="equipment" value="${esc(j.equipment)}"></div></div>
<label>Complaint / Observation</label><textarea name="complaint">${esc(j.complaint)}</textarea>
<div class="formgrid">
<div><label>Before Photo</label>${j.before?`<img src="${j.before}" style="width:100%;height:150px;object-fit:cover;border-radius:10px;margin-bottom:7px">`:''}<input id="editBefore" type="file" accept="image/*" onchange="replaceEditPhoto(this,'editBeforeData')"><input id="editBeforeData" name="before" type="hidden" value="${esc(j.before)}"></div>
<div><label>After Photo</label>${j.after?`<img src="${j.after}" style="width:100%;height:150px;object-fit:cover;border-radius:10px;margin-bottom:7px">`:''}<input id="editAfter" type="file" accept="image/*" onchange="replaceEditPhoto(this,'editAfterData')"><input id="editAfterData" name="after" type="hidden" value="${esc(j.after)}"></div>
</div>
<div class="section"><h3>HVAC Readings</h3><div class="formgrid">${readings.map((x,i)=>`<div><label>${x}</label><input name="r${i}" value="${esc(j['r'+i]||'')}" inputmode="decimal"></div>`).join('')}</div></div>
<label>Work Performed</label><textarea name="work" required>${esc(j.work)}</textarea>
<label>Parts / Materials Used</label><textarea name="parts">${esc(j.parts)}</textarea>
<label>Remarks</label><textarea name="remarks">${esc(j.remarks)}</textarea>
<div class="formgrid"><div><label>Status</label><select name="status">${['Completed','In Progress','Pending'].map(x=>`<option ${x===j.status?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Priority</label><select name="priority">${['Normal','High','Critical'].map(x=>`<option ${x===j.priority?'selected':''}>${x}</option>`).join('')}</select></div></div>
<button class="btn green" style="width:100%;margin-top:16px">💾 Save Changes</button>

function updateJob(e,id){

let f=new FormData(e.target);
let updated=Object.fromEntries(f.entries());
updated.id=old.id;
updated.before=document.getElementById('editBeforeData').value||old.before||'';
updated.after=document.getElementById('editAfterData').value||old.after||'';
let idx=state.jobs.findIndex(x=>String(x.id)===String(id));

if(updated.location&&!state.locations.includes(updated.location))state.locations.push(updated.location);
if(updated.equipment&&!state.equipment.includes(updated.equipment))state.equipment.push(updated.equipment);
save();state.page='jobs';render();alert('Maintenance report updated successfully.');
}

function saveSchedule(e,id,isEdit){

function deleteSchedule(id){

*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;padding:20px;color:#122033;background:#fff}h1{color:#1769aa;margin:0 0 4px;font-size:24px}h2{margin:0 0 14px;font-size:19px}.meta{color:#52687a;margin-bottom:16px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:15px 0 20px}.stat{border:1px solid #dbe5ed;border-radius:8px;padding:10px;background:#f6f9fb}.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:#52687a}table{border-collapse:collapse;width:100%;font-size:10px;table-layout:fixed}th{background:#eaf1f6;font-weight:700}td,th{border:1px solid #b9c5cf;padding:6px;text-align:left;vertical-align:top;overflow-wrap:anywhere}th:nth-child(1){width:9%}th:nth-child(2){width:11%}th:nth-child(3){width:12%}th:nth-child(4){width:12%}th:nth-child(5){width:12%}th:nth-child(6){width:25%}th:nth-child(7){width:11%}th:nth-child(8){width:8%}.footer{margin-top:18px;font-size:10px;color:#718096}.photo-section{margin-top:28px}.photo-section h2{color:#1769aa;border-bottom:2px solid #1769aa;padding-bottom:6px}.photo-card{border:1px solid #cfd9e2;border-radius:9px;padding:10px;margin:0 0 12px;page-break-inside:avoid}.photo-head{margin-bottom:8px}.sub{font-size:9px;color:#64748b;margin-top:3px}.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}.photo-box{border:1px solid #d6dee6;border-radius:7px;padding:6px;min-height:170px}.photo-box .label{font-weight:700;font-size:9px;color:#52687a;margin-bottom:5px}.photo-box img{width:100%;height:190px;object-fit:contain;background:#f7f9fb;border-radius:5px}.no-photo{height:190px;display:flex;align-items:center;justify-content:center;background:#f7f9fb;color:#94a3b8;font-size:11px;border-radius:5px}.work{font-size:9px;margin-top:7px;line-height:1.4}.page-break{page-break-before:always}
@media(max-width:700px){body{padding:14px}h1{font-size:20px}h2{font-size:16px}.summary{grid-template-columns:repeat(2,1fr)}table{font-size:8px}td,th{padding:4px}.photos{grid-template-columns:1fr 1fr}.photo-box img,.no-photo{height:130px}}
@media print{body{padding:8mm}.no-print{display:none}.summary{grid-template-columns:repeat(4,1fr)}table{font-size:8.5px}thead{display:table-header-group}tr{page-break-inside:avoid}.photo-section{page-break-before:always}.photo-box img{height:180px}@page{size:A4 landscape;margin:8mm}}
</style></head><body>
<h1>BHR Solutions</h1><h2>Monthly HVAC Maintenance Report</h2>
<div class="meta"><b>Month:</b> ${esc(pretty)} &nbsp; | &nbsp; <b>Generated:</b> ${esc(new Date().toLocaleString())}</div>
<div class="summary"><div class="stat"><b>${jobs.length}</b><span>Total jobs</span></div><div class="stat"><b>${completed}</b><span>Completed</span></div><div class="stat"><b>${pending}</b><span>Pending / In progress</span></div><div class="stat"><b>${critical}</b><span>Critical</span></div></div>
<h2>Maintenance Summary</h2>
<table><thead><tr><th>Date</th><th>Technician</th><th>Location</th><th>Equipment</th><th>Type</th><th>Work performed</th><th>Parts / Materials</th><th>Status</th></tr></thead><tbody>${rows||'<tr><td colspan="8">No reports saved for this month.</td></tr>'}</tbody></table>
${photoJobs.length?`<section class="photo-section"><h2>📷 Before / After Photo Evidence</h2><p style="font-size:10px;color:#64748b">Photo evidence for ${photoJobs.length} maintenance job${photoJobs.length===1?'':'s'} recorded during ${esc(pretty)}.</p>${photoCards}</section>`:`<section class="photo-section"><h2>📷 Before / After Photo Evidence</h2><p style="font-size:10px;color:#64748b">No before/after photos were saved for this month.</p></section>`}
<div class="footer">Generated by BHR Solutions Maintenance Report • Monthly report includes photo evidence when photos are available.</div>
<script>window.onload=function(){setTimeout(function(){window.print()},350)}<\/script></body></html>`;
}

function printMonthlyReport(month){
let html=buildMonthlyReportHTML(month);
let w=window.open('','_blank');
if(!w)return alert('Please allow pop-ups to print the report.');
w.document.open();
w.document.write(html);
w.document.close();
}
function backupPage(){
let total=state.jobs.length, schedules=state.schedules.length, photos=state.jobs.filter(j=>j.before||j.after).length;
let last=localStorage.getItem('mr_last_backup');
return `<h2>💾 Data Backup & Export</h2>
<div class="backupbox"><div class="row"><div class="backupicon">🛡️</div><div><h3 style="margin:0">Protect your maintenance history</h3><p style="margin:4px 0;color:#64748b;font-size:12px">Your jobs stay on this device. Use a JSON backup regularly so you can restore everything, including before/after photos.</p></div></div></div>
<div class="card" style="margin-bottom:12px;background:#f5fbf7;border-color:#cfe9da"><b>📱 Offline storage: ${storageMode}</b><p style="margin:5px 0 0;color:#64748b;font-size:12px">Jobs, schedules and photos are stored locally on this phone and remain available without internet. Keep regular backups before resetting or clearing the app.</p></div>
<div class="grid">
<div class="card stat"><b>${total}</b><span>Saved maintenance reports</span></div>
<div class="card stat"><b>${schedules}</b><span>Saved schedules</span></div>
</div>
<div class="section backupbox"><h3>📦 Full Backup — Recommended</h3><p style="font-size:12px;color:#64748b">Creates one backup file containing jobs, photos, schedules, locations, equipment and app settings. Keep this file somewhere safe.</p><button class="btn green" onclick="downloadBackup()">⬇️ Backup Everything (JSON)</button>${last?`<p style="font-size:11px;color:#64748b;margin:9px 0 0">Last backup: ${esc(last)}</p>`:''}</div>
<div class="section backupbox"><h3>📊 Excel / CSV Export</h3><p style="font-size:12px;color:#64748b">CSV files open directly in Microsoft Excel and contain your maintenance records in table form. Photos are represented by Yes/No columns.</p><div class="row" style="flex-wrap:wrap"><button class="btn" onclick="exportJobsCSV()">📊 Export All Jobs CSV</button><button class="btn secondary" onclick="exportCurrentMonthCSV()">📅 Export Selected Month CSV</button></div></div>
<div class="section backupbox"><h3>♻️ Restore Full Backup</h3><p style="font-size:12px;color:#64748b">Choose a JSON backup previously created by this app. Restoring replaces the current app data with the backup data.</p><label class="filebtn">📂 Choose Backup File<input type="file" accept="application/json,.json" class="hidden" onchange="restoreBackup(this)"></label></div>
<div class="section backupbox"><h3>⚠️ Important</h3><ul style="font-size:12px;color:#64748b;line-height:1.6;padding-left:20px"><li>Export a backup before clearing Chrome site data or changing/resetting your phone.</li><li>The JSON backup preserves photos; CSV does not.</li><li>GitHub Pages hosts the app, but your job records are not uploaded to GitHub.</li></ul></div>`;
}
function downloadFile(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function stamp(){let d=new Date();return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'_'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+String(d.getSeconds()).padStart(2,'0')}
function downloadBackup(){
let payload={app:'BHR Solutions Maintenance Report',version:2,backupCreatedAt:new Date().toISOString(),user:state.user,jobs:state.jobs,locations:state.locations,equipment:state.equipment,schedules:state.schedules,reportDate:localStorage.getItem('mr_report_date')||'',reportMonth:localStorage.getItem('mr_report_month')||''};
downloadFile('BHR_Maintenance_Backup_'+stamp()+'.json',JSON.stringify(payload,null,2),'application/json;charset=utf-8');
localStorage.setItem('mr_last_backup',new Date().toLocaleString());
alert('Backup created successfully. Save the JSON file somewhere safe.');render();
}
function csvCell(v){let x=String(v??'').replace(/\r?\n/g,' ');return '"'+x.replace(/"/g,'""')+'"'}
function jobsCSV(jobs){
let headers=['ID','Date','Technician','Location','Equipment','Work Type','Complaint / Observation','Work Performed','Parts / Materials','Remarks','Room Temp °C','Supply Air °C','Return Air °C','Suction PSI','Discharge PSI','Compressor A','Fan A','Voltage L1-L2','Voltage L2-L3','Voltage L3-L1','Status','Priority','Before Photo','After Photo'];
let rows=[headers.map(csvCell).join(',')];
for(let j of jobs){rows.push([j.id,j.date,j.technician,j.location,j.equipment,j.type,j.complaint,j.work,j.parts,j.remarks,j.r0,j.r1,j.r2,j.r3,j.r4,j.r5,j.r6,j.r7,j.r8,j.r9,j.status,j.priority,j.before?'Yes':'No',j.after?'Yes':'No'].map(csvCell).join(','))}
return '\ufeff'+rows.join('\r\n');
}
function exportJobsCSV(){downloadFile('BHR_Maintenance_All_Jobs_'+stamp()+'.csv',jobsCSV(state.jobs),'text/csv;charset=utf-8');alert('All maintenance jobs exported. The CSV can be opened in Excel.');}
function exportCurrentMonthCSV(){let m=localStorage.getItem('mr_report_month')||localDate().slice(0,7);let jobs=state.jobs.filter(j=>monthKey(j.date)===m);downloadFile('BHR_Maintenance_'+m+'.csv',jobsCSV(jobs),'text/csv;charset=utf-8');alert('Selected month exported: '+monthName(m));}
function restoreBackup(inp){let f=inp.files&&inp.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||!Array.isArray(x.jobs)||!Array.isArray(x.schedules))throw new Error('Invalid backup');if(!confirm('Restore this backup? Current saved data will be replaced by the backup.'))return;state.jobs=x.jobs;state.locations=Array.isArray(x.locations)?x.locations:[];state.equipment=Array.isArray(x.equipment)?x.equipment:[];state.schedules=x.schedules;state.user=x.user||state.user;save();if(state.user)localStorage.setItem('mr_user',state.user);if(x.reportDate)localStorage.setItem('mr_report_date',x.reportDate);if(x.reportMonth)localStorage.setItem('mr_report_month',x.reportMonth);localStorage.setItem('mr_last_backup','Restored '+new Date().toLocaleString());alert('Backup restored successfully. Your maintenance history is back.');state.page='dashboard';render();}catch(e){alert('This is not a valid BHR Maintenance backup file.')}};r.readAsText(f);inp.value=''}

const pages={dashboard,new:newPage,jobs,locations,equipment,schedule,reports,backup:backupPage};initStorage();

let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
e.preventDefault();deferredInstallPrompt=e;
const b=document.getElementById('installBar');if(b)b.classList.add('show');
});
async function installPWA(){
if(!deferredInstallPrompt){
alert('If Chrome does not show the install prompt, open Chrome menu ⋮ and choose "Add to Home screen" or "Install app".');
return;
}
deferredInstallPrompt.prompt();
try{await deferredInstallPrompt.userChoice}catch(e){}
deferredInstallPrompt=null;
const b=document.getElementById('installBar');if(b)b.classList.remove('show');
}
window.addEventListener('appinstalled',()=>{
const b=document.getElementById('installBar');if(b)b.classList.remove('show');
});
if('serviceWorker' in navigator){
window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script></body></html>
